name: Supabase Keepalive

on:
  schedule:
    # Runs daily at 02:30 UTC
    - cron: "30 2 * * *"
  workflow_dispatch:
    # Allows manual trigger from GitHub Actions UI

jobs:
  ping:
    name: Ping Supabase Postgres
    runs-on: ubuntu-latest

    steps:
      - name: Check secret exists
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::error::SUPABASE_DB_URL secret is missing. Add it in Repository Settings → Secrets and variables → Actions."
            exit 1
          fi
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Ping database
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          psql "$SUPABASE_DB_URL" -c "select now();"
