name: Keep Lunara Services Awake

on:
  schedule:
    # Every 10 minutes, UTC
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    name: Ping Vercel and Render
    runs-on: ubuntu-latest

    steps:
      - name: Ping Vercel frontend
        run: |
          echo "Pinging Vercel..."
          curl -L --retry 3 --retry-delay 5 --max-time 30 \
            "$VERCEL_URL"
        env:
          VERCEL_URL: ${{ secrets.VERCEL_URL }}

      - name: Ping Render backend
        run: |
          echo "Pinging Render..."
          curl -L --retry 3 --retry-delay 10 --max-time 60 \
            "$RENDER_URL"
        env:
          RENDER_URL: ${{ secrets.RENDER_URL }}
